<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProScanner - Penghitung Objek</title>
    <!-- Memuat Tailwind CSS untuk tampilan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body class="flex flex-col h-[100dvh] bg-gray-950 text-gray-100 font-sans overflow-hidden">

    <!-- HEADER -->
    <div class="bg-gray-900 text-white p-3 flex justify-between items-center z-10 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg shadow-sm">
                <!-- Ikon Video -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            </div>
            <h1 class="text-xl font-bold tracking-wide">ProScanner</h1>
        </div>
        <button id="btnToggleSettings" class="p-2 bg-gray-800 text-gray-300 hover:bg-gray-700 rounded-full transition-colors">
            <!-- Ikon Settings -->
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <!-- AREA UTAMA -->
    <div class="flex-1 relative overflow-hidden flex justify-center items-center bg-black">
        
        <!-- Loading Screen -->
        <div id="loadingScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-500 mb-4"></div>
            <p class="font-medium text-gray-300">Menyiapkan Engine AI...</p>
        </div>

        <!-- Layar Kosong Awal -->
        <div id="emptyScreen" class="hidden text-gray-400 flex flex-col items-center px-8 text-center max-w-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-700 mb-6"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            <h2 class="text-white text-xl font-bold mb-2">Siap Menghitung</h2>
            <p class="text-sm">Buka kamera untuk menghitung langsung, atau pilih gambar dari galeri Anda.</p>
        </div>

        <!-- Live Video Area -->
        <div id="liveContainer" class="hidden relative w-full h-full flex flex-col">
            <video id="videoElement" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div class="absolute top-4 left-4 right-4 flex justify-center z-10">
                <select id="cameraSelect" class="bg-black/60 text-white px-4 py-2 rounded-full text-sm backdrop-blur-md border border-gray-600 outline-none max-w-xs truncate"></select>
            </div>
            
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 w-full flex justify-center px-4">
                <button id="btnCapture" class="bg-white text-blue-600 font-bold px-6 py-3 rounded-full shadow-[0_0_20px_rgba(255,255,255,0.4)] active:scale-90 transition-transform border-4 border-gray-300 flex items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                    Hitung Objek
                </button>
            </div>
        </div>

        <!-- Result Area (Canvas & Image) -->
        <img id="sourceImage" class="hidden" alt="Source" />
        <canvas id="resultCanvas" class="hidden max-w-full max-h-full object-contain"></canvas>
        
        <div id="resultBadge" class="hidden absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-2 rounded-full shadow-2xl font-black text-2xl flex items-center gap-3 border-[3px] border-blue-400 z-10">
            <span id="objCountText">0</span>
            <span class="text-xs font-semibold text-blue-100 uppercase tracking-widest mt-1">Objek</span>
        </div>
    </div>

    <!-- PANEL KONTROL BAWAH -->
    <div class="relative bg-gray-900 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.5)] p-3 flex flex-col gap-3 z-10">
        
        <!-- PENGATURAN MELAYANG (FLOATING) -->
        <div id="settingsPanel" class="hidden absolute bottom-full left-3 right-3 mb-3 bg-gray-950/95 backdrop-blur-md p-4 rounded-2xl border border-gray-800 flex flex-col gap-3 shadow-2xl z-20">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h3 class="font-semibold text-gray-200 flex items-center gap-2">Pengaturan Akurasi</h3>
            </div>

            <div class="flex items-center justify-between bg-gray-900 p-3 rounded-lg border border-gray-800">
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-white">Auto Akurasi (Otsu)</span>
                    <span class="text-[11px] text-gray-500">Mencari pencahayaan terbaik</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="chkAuto" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div id="manualThreshContainer" class="hidden flex flex-col gap-1">
                <label class="text-xs font-medium text-gray-400 flex justify-between">
                    <span>Sensitivitas Manual</span><span id="valThresh">128</span>
                </label>
                <input type="range" id="rngThresh" min="0" max="255" value="128" class="w-full accent-blue-500">
            </div>

            <div class="flex gap-4">
                <div class="flex-1 flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-400 flex justify-between"><span>Abaikan Debu</span><span id="valMinArea">10</span></label>
                    <input type="range" id="rngMinArea" min="1" max="500" value="10" class="w-full accent-blue-500">
                </div>
                <div class="flex-1 flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-400 flex justify-between"><span>Batas Maks</span><span id="valMaxArea">15000</span></label>
                    <input type="range" id="rngMaxArea" min="100" max="30000" step="500" value="15000" class="w-full accent-blue-500">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="btnLightObj" class="flex-1 py-2 rounded-lg text-xs font-bold border bg-blue-600/20 border-blue-500 text-blue-400">⚪ Objek Terang</button>
                <button id="btnDarkObj" class="flex-1 py-2 rounded-lg text-xs font-bold border bg-gray-900 border-gray-700 text-gray-500">⚫ Objek Gelap</button>
            </div>
        </div>

        <!-- TOMBOL AKSI -->
        <div class="flex gap-2">
            <label class="flex-1 bg-gray-800 text-gray-300 py-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-gray-700 transition-colors active:scale-95 border border-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                <span class="font-semibold text-sm">Galeri</span>
                <input type="file" id="fileInput" accept="image/*" class="hidden" />
            </label>

            <button id="btnStartCamera" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-blue-500 transition-colors shadow-lg active:scale-95 border border-blue-500 font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
                <span class="text-sm">Kamera Langsung</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- VARIABLES ---
        let cvReady = false;
        let isLiveMode = false;
        let stream = null;
        let currentImageLoaded = false;
        let objectCount = 0;
        
        // Settings Variables
        let isSettingsOpen = false;
        let autoPrecision = true;
        let thresholdValue = 128;
        let minArea = 10;
        let maxArea = 15000;
        let isLightOnDark = true;

        // --- DOM ELEMENTS ---
        const ui = {
            loading: document.getElementById('loadingScreen'),
            empty: document.getElementById('emptyScreen'),
            liveContainer: document.getElementById('liveContainer'),
            video: document.getElementById('videoElement'),
            camSelect: document.getElementById('cameraSelect'),
            btnCapture: document.getElementById('btnCapture'),
            imgSrc: document.getElementById('sourceImage'),
            canvas: document.getElementById('resultCanvas'),
            badge: document.getElementById('resultBadge'),
            countText: document.getElementById('objCountText'),
            fileInput: document.getElementById('fileInput'),
            btnStartCam: document.getElementById('btnStartCamera'),
            btnSettings: document.getElementById('btnToggleSettings'),
            panelSettings: document.getElementById('settingsPanel'),
            // Inputs
            chkAuto: document.getElementById('chkAuto'),
            manualThreshCont: document.getElementById('manualThreshContainer'),
            rngThresh: document.getElementById('rngThresh'),
            valThresh: document.getElementById('valThresh'),
            rngMinArea: document.getElementById('rngMinArea'),
            valMinArea: document.getElementById('valMinArea'),
            rngMaxArea: document.getElementById('rngMaxArea'),
            valMaxArea: document.getElementById('valMaxArea'),
            btnLight: document.getElementById('btnLightObj'),
            btnDark: document.getElementById('btnDarkObj'),
        };

        // --- INIT OPENCV ---
        function onOpenCvReady() {
            cvReady = true;
            ui.loading.classList.add('hidden');
            ui.empty.classList.remove('hidden');
        }

        // --- UI UPDATES ---
        function updateScreenState() {
            ui.empty.classList.add('hidden');
            ui.liveContainer.classList.add('hidden');
            ui.canvas.classList.add('hidden');
            ui.badge.classList.add('hidden');

            if (isLiveMode) {
                ui.liveContainer.classList.remove('hidden');
            } else if (currentImageLoaded) {
                ui.canvas.classList.remove('hidden');
                ui.badge.classList.remove('hidden');
            } else {
                ui.empty.classList.remove('hidden');
            }

            ui.btnStartCam.querySelector('span').innerText = isLiveMode ? "Tutup Kamera" : "Kamera Langsung";
        }

        ui.btnSettings.addEventListener('click', () => {
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                ui.panelSettings.classList.remove('hidden');
                ui.btnSettings.classList.replace('bg-gray-800', 'bg-blue-600');
                ui.btnSettings.classList.replace('text-gray-300', 'text-white');
            } else {
                ui.panelSettings.classList.add('hidden');
                ui.btnSettings.classList.replace('bg-blue-600', 'bg-gray-800');
                ui.btnSettings.classList.replace('text-white', 'text-gray-300');
            }
        });

        // --- CAMERA LOGIC ---
        async function getCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                ui.camSelect.innerHTML = '';
                videoDevices.forEach((cam, idx) => {
                    const opt = document.createElement('option');
                    opt.value = cam.deviceId;
                    opt.text = cam.label || `Kamera ${idx + 1}`;
                    ui.camSelect.appendChild(opt);
                });

                // Pilih kamera belakang jika ada
                const backCam = videoDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
                if (backCam) ui.camSelect.value = backCam.deviceId;

            } catch (err) {
                alert("Gagal mengakses kamera. Pastikan browser mengizinkan akses kamera.");
            }
        }

        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            try {
                const deviceId = ui.camSelect.value;
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        width: { ideal: 1920 }, height: { ideal: 1080 }
                    }
                });
                ui.video.srcObject = stream;
            } catch (err) {
                console.error("Error start kamera", err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        }

        ui.btnStartCam.addEventListener('click', async () => {
            if (isLiveMode) {
                isLiveMode = false;
                stopCamera();
                updateScreenState();
            } else {
                isLiveMode = true;
                currentImageLoaded = false;
                updateScreenState();
                await getCameras();
                startCamera();
            }
        });

        ui.camSelect.addEventListener('change', startCamera);

        // --- CAPTURE & UPLOAD ---
        ui.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                isLiveMode = false;
                stopCamera();
                ui.imgSrc.src = URL.createObjectURL(file);
                currentImageLoaded = true;
                updateScreenState();
            }
        });

        ui.btnCapture.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = ui.video.videoWidth;
            canvas.height = ui.video.videoHeight;
            canvas.getContext('2d').drawImage(ui.video, 0, 0);
            
            ui.imgSrc.src = canvas.toDataURL('image/jpeg');
            isLiveMode = false;
            stopCamera();
            currentImageLoaded = true;
            updateScreenState();
        });

        // --- SETTINGS LISTENERS ---
        function triggerProcess() {
            if (currentImageLoaded && !isLiveMode) processImage();
        }

        ui.chkAuto.addEventListener('change', (e) => {
            autoPrecision = e.target.checked;
            ui.manualThreshCont.classList.toggle('hidden', autoPrecision);
            triggerProcess();
        });

        ui.rngThresh.addEventListener('input', (e) => {
            thresholdValue = e.target.value;
            ui.valThresh.innerText = thresholdValue;
            triggerProcess();
        });

        ui.rngMinArea.addEventListener('input', (e) => {
            minArea = e.target.value;
            ui.valMinArea.innerText = minArea;
            triggerProcess();
        });

        ui.rngMaxArea.addEventListener('input', (e) => {
            maxArea = e.target.value;
            ui.valMaxArea.innerText = maxArea;
            triggerProcess();
        });

        function updateColorMode(isLight) {
            isLightOnDark = isLight;
            if (isLight) {
                ui.btnLight.className = "flex-1 py-2 rounded-lg text-xs font-bold border bg-blue-600/20 border-blue-500 text-blue-400";
                ui.btnDark.className = "flex-1 py-2 rounded-lg text-xs font-bold border bg-gray-900 border-gray-700 text-gray-500";
            } else {
                ui.btnDark.className = "flex-1 py-2 rounded-lg text-xs font-bold border bg-blue-600/20 border-blue-500 text-blue-400";
                ui.btnLight.className = "flex-1 py-2 rounded-lg text-xs font-bold border bg-gray-900 border-gray-700 text-gray-500";
            }
            triggerProcess();
        }
        ui.btnLight.addEventListener('click', () => updateColorMode(true));
        ui.btnDark.addEventListener('click', () => updateColorMode(false));

        // Wait for image to load before processing
        ui.imgSrc.addEventListener('load', () => {
            if(cvReady) processImage();
        });

        // --- CORE AI PROCESSING ---
        function processImage() {
            if (!cvReady || !currentImageLoaded) return;
            
            let img, src, gray, blurred, thresh, kernel, contours, hierarchy;
            
            try {
                img = cv.imread(ui.imgSrc);
                src = new cv.Mat();
                
                let maxSize = 1000;
                if (img.cols > maxSize || img.rows > maxSize) {
                    let scale = Math.min(maxSize / img.cols, maxSize / img.rows);
                    let dsize = new cv.Size(Math.round(img.cols * scale), Math.round(img.rows * scale));
                    cv.resize(img, src, dsize, 0, 0, cv.INTER_AREA);
                } else {
                    img.copyTo(src);
                }
                img.delete();

                gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

                blurred = new cv.Mat();
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

                thresh = new cv.Mat();
                let threshType = isLightOnDark ? cv.THRESH_BINARY : cv.THRESH_BINARY_INV;
                
                if (autoPrecision) {
                    cv.threshold(blurred, thresh, 0, 255, threshType | cv.THRESH_OTSU);
                } else {
                    cv.threshold(blurred, thresh, parseInt(thresholdValue), 255, threshType);
                }

                kernel = cv.Mat.ones(3, 3, cv.CV_8U);
                cv.morphologyEx(thresh, thresh, cv.MORPH_OPEN, kernel);

                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let count = 0;
                for (let i = 0; i < contours.size(); ++i) {
                    let contour = contours.get(i);
                    let area = cv.contourArea(contour);
                    
                    if (area >= minArea && area <= maxArea) {
                        count++;
                        let M = cv.moments(contour);
                        if (M.m00 !== 0) {
                            let cx = M.m10 / M.m00;
                            let cy = M.m01 / M.m00;
                            cv.circle(src, new cv.Point(cx, cy), 4, [0, 255, 0, 255], -1); 
                            cv.circle(src, new cv.Point(cx, cy), 6, [0, 0, 0, 255], 2);  
                        }
                    }
                }

                cv.imshow(ui.canvas, src);
                ui.countText.innerText = count;

            } catch (err) {
                console.error("OpenCV Error:", err);
            } finally {
                if (src && !src.isDeleted()) src.delete();
                if (gray && !gray.isDeleted()) gray.delete();
                if (blurred && !blurred.isDeleted()) blurred.delete();
                if (thresh && !thresh.isDeleted()) thresh.delete();
                if (kernel && !kernel.isDeleted()) kernel.delete();
                if (contours && !contours.isDeleted()) contours.delete();
                if (hierarchy && !hierarchy.isDeleted()) hierarchy.delete();
            }
        }
    </script>
</body>
</html>
