<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProScanner - Penghitung Otomatis</title>
    <!-- Memuat Tailwind CSS untuk tampilan premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat OpenCV.js secara asinkron -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body class="flex flex-col h-[100dvh] bg-gray-950 text-gray-100 font-sans overflow-hidden select-none">

    <!-- HEADER -->
    <div class="bg-gray-900 text-white p-4 flex justify-between items-center z-10 border-b border-gray-800 shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                <!-- Ikon Video -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide leading-none">ProScanner</h1>
                <span class="text-[10px] text-blue-400 font-semibold uppercase tracking-wider">AI Auto-Calibration Engine</span>
            </div>
        </div>
        <!-- Indikator Status Otomatis -->
        <div class="flex items-center gap-1.5 bg-blue-500/10 border border-blue-500/20 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            <span class="text-xs font-bold text-blue-400">AUTO</span>
        </div>
    </div>

    <!-- AREA UTAMA -->
    <div class="flex-1 relative overflow-hidden flex justify-center items-center bg-black">
        
        <!-- Banner Notifikasi Kustom -->
        <div id="toastNotification" class="hidden absolute top-4 left-4 right-4 bg-blue-600 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 z-30 text-sm border border-blue-400/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <span id="toastText">Notifikasi</span>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-500 mb-4"></div>
            <p class="font-medium text-gray-300">Menyiapkan Engine Visi AI...</p>
        </div>

        <!-- Layar Kosong Awal -->
        <div id="emptyScreen" class="hidden text-gray-400 flex flex-col items-center px-8 text-center max-w-sm">
            <div class="bg-gray-900 p-5 rounded-full mb-6 border border-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            </div>
            <h2 class="text-white text-xl font-bold mb-2">Siap Menghitung Otomatis</h2>
            <p class="text-sm text-gray-500 leading-relaxed">Letakkan part di dalam kotak fokus. AI otomatis mendeteksi ukuran, bahan, dan jumlah part secara instan.</p>
        </div>

        <!-- Live Video Area -->
        <div id="liveContainer" class="hidden relative w-full h-full flex flex-col">
            <video id="videoElement" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-10">
                <select id="cameraSelect" class="bg-black/70 text-white px-4 py-2 rounded-full text-xs font-semibold backdrop-blur-md border border-gray-700 outline-none max-w-[150px] truncate"></select>
                
                <!-- Tombol Senter HP (Torch) -->
                <button id="btnTorch" class="hidden bg-black/70 text-white p-2.5 rounded-full border border-gray-700 backdrop-blur-md active:scale-95 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17a3 3 0 1 1-6 0c0-2.2 2.2-4 3-6 .8 2 3 3.8 3 6Z"/><path d="M18 6h-2V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/></svg>
                </button>
            </div>
            
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 w-full flex justify-center px-4">
                <button id="btnCapture" class="bg-white text-gray-900 font-extrabold px-8 py-3.5 rounded-full shadow-[0_0_30px_rgba(255,255,255,0.3)] active:scale-90 transition-transform border-4 border-gray-300 flex items-center gap-2.5 text-sm uppercase tracking-wider">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                    Pindai Sekarang
                </button>
            </div>
        </div>

        <!-- Result Area (Canvas & Image) -->
        <img id="sourceImage" class="hidden" alt="Source" />
        <canvas id="resultCanvas" class="hidden max-w-full max-h-full object-contain"></canvas>
        
        <!-- Badge Jumlah Akhir -->
        <div id="resultBadge" class="hidden absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-8 py-2.5 rounded-full shadow-[0_10px_25px_-5px_rgba(59,130,246,0.5)] font-black text-3xl flex items-center gap-3 border-[3px] border-blue-400 z-10">
            <span id="objCountText">0</span>
            <span class="text-xs font-bold text-blue-100 uppercase tracking-widest mt-1">Objek</span>
        </div>
    </div>

    <!-- PANEL KONTROL BAWAH (MINIMALIS TANPA SETTING) -->
    <div class="bg-gray-900 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.5)] p-4 flex flex-col gap-3 z-10 border-t border-gray-800">
        
        <!-- TOMBOL AKSI UTAMA -->
        <div class="flex gap-3">
            <label class="flex-1 bg-gray-800 text-gray-300 py-3.5 rounded-2xl flex items-center justify-center gap-2 cursor-pointer hover:bg-gray-700 transition-colors active:scale-95 border border-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                <span class="font-bold text-sm">Ambil Galeri</span>
                <input type="file" id="fileInput" accept="image/*" class="hidden" />
            </label>

            <button id="btnStartCamera" class="flex-[2] bg-blue-600 text-white py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-500 transition-colors shadow-lg active:scale-95 border border-blue-500 font-extrabold">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
                <span class="text-sm">Buka Kamera</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- VARIABLES ---
        let cvReady = false;
        let isLiveMode = false;
        let stream = null;
        let currentImageLoaded = false;
        let objectCount = 0;
        let currentFacingMode = 'environment'; // Default ke kamera belakang
        let isTorchOn = false; // Status senter HP

        // --- DOM ELEMENTS (Lazy Getters untuk menghindari Race Condition) ---
        const ui = {
            get loading() { return document.getElementById('loadingScreen'); },
            get empty() { return document.getElementById('emptyScreen'); },
            get liveContainer() { return document.getElementById('liveContainer'); },
            get video() { return document.getElementById('videoElement'); },
            get camSelect() { return document.getElementById('cameraSelect'); },
            get btnCapture() { return document.getElementById('btnCapture'); },
            get btnTorch() { return document.getElementById('btnTorch'); },
            get imgSrc() { return document.getElementById('sourceImage'); },
            get canvas() { return document.getElementById('resultCanvas'); },
            get badge() { return document.getElementById('resultBadge'); },
            get countText() { return document.getElementById('objCountText'); },
            get fileInput() { return document.getElementById('fileInput'); },
            get btnStartCam() { return document.getElementById('btnStartCamera'); },
            get toast() { return document.getElementById('toastNotification'); },
            get toastText() { return document.getElementById('toastText'); }
        };

        // --- CUSTOM TOAST NOTIFICATION ---
        function showNotification(message) {
            if (!ui.toastText || !ui.toast) return;
            ui.toastText.innerText = message;
            ui.toast.classList.remove('hidden');
            setTimeout(() => {
                if (ui.toast) ui.toast.classList.add('hidden');
            }, 5000);
        }

        // --- INIT OPENCV ---
        window.onOpenCvReady = function() {
            cvReady = true;
            const runOnLoad = () => {
                if (ui.loading) ui.loading.classList.add('hidden');
                if (ui.empty) ui.empty.classList.remove('hidden');
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', runOnLoad);
            } else {
                runOnLoad();
            }
        };

        // --- STREAMLINED UI STATES ---
        function updateScreenState() {
            if (!ui.empty) return;
            ui.empty.classList.add('hidden');
            ui.liveContainer.classList.add('hidden');
            ui.canvas.classList.add('hidden');
            ui.badge.classList.add('hidden');

            if (isLiveMode) {
                ui.liveContainer.classList.remove('hidden');
            } else if (currentImageLoaded) {
                ui.canvas.classList.remove('hidden');
                ui.badge.classList.remove('hidden');
            } else {
                ui.empty.classList.remove('hidden');
            }

            if (ui.btnStartCam) {
                ui.btnStartCam.querySelector('span').innerText = isLiveMode ? "Tutup Kamera" : "Buka Kamera";
            }
        }

        // --- CAMERA LOGIC ---
        function populateCameraSelect() {
            if (!ui.camSelect) return;
            ui.camSelect.innerHTML = '';
            
            const optBack = document.createElement('option');
            optBack.value = 'environment';
            optBack.text = 'Kamera Belakang';
            if(currentFacingMode === 'environment') optBack.selected = true;
            ui.camSelect.appendChild(optBack);

            const optFront = document.createElement('option');
            optFront.value = 'user';
            optFront.text = 'Kamera Depan';
            if(currentFacingMode === 'user') optFront.selected = true;
            ui.camSelect.appendChild(optFront);
        }

        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            try {
                populateCameraSelect();
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 }
                    }
                });
                if (ui.video) ui.video.srcObject = stream;

                // Cek kapabilitas senter setelah kamera menyala
                setTimeout(async () => {
                    if (stream && ui.btnTorch) {
                        const track = stream.getVideoTracks()[0];
                        try {
                            const capabilities = track.getCapabilities();
                            if (capabilities && capabilities.torch) {
                                ui.btnTorch.classList.remove('hidden');
                            } else {
                                ui.btnTorch.classList.add('hidden');
                            }
                        } catch (e) {
                            ui.btnTorch.classList.add('hidden');
                        }
                    }
                }, 1000);

            } catch (err) {
                console.error("Error start kamera", err);
                showNotification("Gagal membuka kamera. Harap salin link di atas lalu tempelkan (paste) langsung ke browser utama HP (Chrome/Safari) agar mendapatkan izin kamera.");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            isTorchOn = false;
            if (ui.btnTorch) {
                ui.btnTorch.classList.add('hidden');
                ui.btnTorch.classList.replace('bg-yellow-500', 'bg-black/60');
                ui.btnTorch.classList.replace('text-gray-900', 'text-white');
            }
        }

        // --- STREAMLINED CORE COMPUTER VISION AUTOMATION ---
        function processImage() {
            if (!cvReady || !currentImageLoaded || !ui.imgSrc || !ui.canvas) return;
            
            let img, src, gray, blurred, tempThresh, contours, hierarchy;
            let roiGray, roiBlurred, roiThresh, preprocessedGray;
            
            try {
                img = cv.imread(ui.imgSrc);
                src = new cv.Mat();
                
                // Prapemrosesan: Normalisasi Ukuran Gambar
                let maxSize = 1000;
                if (img.cols > maxSize || img.rows > maxSize) {
                    let scale = Math.min(maxSize / img.cols, maxSize / img.rows);
                    let dsize = new cv.Size(Math.round(img.cols * scale), Math.round(img.rows * scale));
                    cv.resize(img, src, dsize, 0, 0, cv.INTER_AREA);
                } else {
                    img.copyTo(src);
                }
                img.delete();

                // 1. KOTAK FOKUS OTOMATIS (Region of Interest / ROI)
                // Dikunci secara optimal pada 75% layar agar frame pindaian sangat pas & ringkas
                let roiWidthPercent = 75;
                let roiHeightPercent = 75;
                let roiW = Math.round(src.cols * (roiWidthPercent / 100));
                let roiH = Math.round(src.rows * (roiHeightPercent / 100));
                let roiX = Math.round((src.cols - roiW) / 2);
                let roiY = Math.round((src.rows - roiH) / 2);

                let rectRoi = new cv.Rect(roiX, roiY, roiW, roiH);

                gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

                // Isolasi area kerja di dalam kotak saja
                roiGray = gray.roi(rectRoi);

                // 2. DETEKSI WARNA LATAR OTOMATIS (Auto-Background Calibration)
                let backgroundMean = 0;
                let sampleSize = Math.min(15, roiGray.cols, roiGray.rows);
                let sampleSum = 0;
                let sampleCount = 0;
                for (let r = 0; r < sampleSize; r++) {
                    for (let c = 0; c < sampleSize; c++) {
                        sampleSum += roiGray.ucharAt(r, c); // Kiri Atas
                        sampleSum += roiGray.ucharAt(roiGray.rows - 1 - r, roiGray.cols - 1 - c); // Kanan Bawah
                        sampleCount += 2;
                    }
                }
                backgroundMean = sampleSum / sampleCount;
                
                let isLightOnDark = (backgroundMean < 127);
                let threshType = isLightOnDark ? cv.THRESH_BINARY : cv.THRESH_BINARY_INV;

                // 3. REMOVE SPECULAR HIGHLIGHTS & VALLEYS (Wajib untuk Logam/Baut Mengkilap)
                // Grayscale Morphological Open/Close secara ajaib meleburkan bintik kilau putih logam
                // agar sekrup menyatu padat dengan warna aslinya tanpa lubang di tengah
                let morphKernelSize = Math.max(5, Math.round(Math.min(roiW, roiH) * 0.025));
                if (morphKernelSize % 2 === 0) morphKernelSize += 1; // Wajib Ganjil
                let grayKernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(morphKernelSize, morphKernelSize));

                preprocessedGray = new cv.Mat();
                if (isLightOnDark) {
                    // Latar gelap: tutup lembah bayangan gelap di dalam objek terang
                    cv.morphologyEx(roiGray, preprocessedGray, cv.MORPH_CLOSE, grayKernel);
                } else {
                    // Latar terang: buka pantulan putih mengkilap di dalam sekrup gelap
                    cv.morphologyEx(roiGray, preprocessedGray, cv.MORPH_OPEN, grayKernel);
                }
                grayKernel.delete();

                // Reduksi bintik-bintik debu ringan menggunakan Median Blur halus
                roiBlurred = new cv.Mat();
                cv.medianBlur(preprocessedGray, roiBlurred, 5);

                // 4. OTSU'S GLOBAL THRESHOLDING
                // Menemukan batas pemisah bimodal (kertas putih vs baut gelap) secara mutlak tanpa noise adaptif
                roiThresh = new cv.Mat();
                cv.threshold(roiBlurred, roiThresh, 0, 255, threshType | cv.THRESH_OTSU);

                // Morfologi Opening kecil untuk membersihkan sisa debu mikro
                let kOpen = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
                cv.morphologyEx(roiThresh, roiThresh, cv.MORPH_OPEN, kOpen);
                kOpen.delete();

                // 5. ANALISIS KONTUR & ESTIMASI DIMENSI PINTAR
                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
                cv.findContours(roiThresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let candidateAreas = [];
                for (let i = 0; i < contours.size(); i++) {
                    let area = cv.contourArea(contours.get(i));
                    // Mengabaikan noise sangat kecil (<100px) dan area background raksasa (>25% total layar)
                    if (area > 100 && area < (roiW * roiH * 0.25)) {
                        candidateAreas.push(area);
                    }
                }

                // 6. KALIBRATOR DIMENSI MATEMATIS AMAN (Preventing Extreme Sizing)
                let medianArea = Math.round(roiW * roiH * 0.003); // Sane fallback (~0.3% of ROI)
                if (candidateAreas.length > 0) {
                    candidateAreas.sort((a, b) => a - b);
                    let mid = Math.floor(candidateAreas.length / 2);
                    medianArea = (candidateAreas.length % 2 !== 0) ? candidateAreas[mid] : (candidateAreas[mid - 1] + candidateAreas[mid]) / 2;
                }

                // Pengaman batas area agar medianArea tidak jatuh terlalu rendah akibat sisa bintik noise/kilau
                let minSaneArea = Math.round(roiW * roiH * 0.001); 
                let maxSaneArea = Math.round(roiW * roiH * 0.05);  
                medianArea = Math.max(minSaneArea, Math.min(medianArea, maxSaneArea));

                let minArea = Math.max(30, Math.round(medianArea * 0.35)); // Batas bawah filter noise
                let maxArea = Math.round(medianArea * 6.0); // Batas atas
                let partSize = medianArea;

                // Menentukan jarak anti-double-counting (mergeDist) secara adaptif dari diameter part
                // Nilai dikurangi ke 0.40 agar tidak melindas sekrup yang posisinya sangat dekat
                let medianDiameter = 2 * Math.sqrt(medianArea / Math.PI);
                let mergeDist = Math.max(10, Math.round(medianDiameter * 0.40));

                // 7. PIPELINE UTAMA: FILTERING & CLUMP SPLITTING
                let rawCenters = [];
                for (let i = 0; i < contours.size(); ++i) {
                    let contour = contours.get(i);
                    let area = cv.contourArea(contour);
                    
                    if (area >= minArea && area <= maxArea) {
                        // Saring kontur garis tipis atau panjang (bukan part padat)
                        let boundRect = cv.boundingRect(contour);
                        let aspect = boundRect.width / boundRect.height;
                        if (aspect > 4.0 || aspect < 0.25) {
                            continue;
                        }

                        // DETEKSI OTOMATIS PART MENEMPEL (Local Peaks Distance Transform)
                        if (area >= (partSize * 1.35)) {
                            let rect = cv.boundingRect(contour);
                            let mask = cv.Mat.zeros(roiThresh.rows, roiThresh.cols, cv.CV_8U);
                            let tempConts = new cv.MatVector();
                            tempConts.push_back(contour);
                            cv.drawContours(mask, tempConts, 0, new cv.Scalar(255), -1);
                            
                            let contourRoi = roiThresh.roi(rect);
                            let maskRoi = mask.roi(rect);
                            
                            let maskedRoi = new cv.Mat();
                            cv.bitwise_and(contourRoi, maskRoi, maskedRoi);
                            
                            let dist = new cv.Mat();
                            cv.distanceTransform(maskedRoi, dist, cv.DIST_L2, 3);
                            
                            let minMax = cv.minMaxLoc(dist);
                            let maxVal = minMax.maxVal;
                            
                            let distThresh = new cv.Mat();
                            cv.threshold(dist, distThresh, maxVal * 0.45, 255, cv.THRESH_BINARY);
                            
                            let distThresh8U = new cv.Mat();
                            distThresh.convertTo(distThresh8U, cv.CV_8U);
                            
                            let peakContours = new cv.MatVector();
                            let peakHierarchy = new cv.Mat();
                            cv.findContours(distThresh8U, peakContours, peakHierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                            
                            if (peakContours.size() > 1) {
                                // Jika terdeteksi lebih dari satu puncak, hitung sebagai multi-part menempel
                                for (let j = 0; j < peakContours.size(); ++j) {
                                    let peakContour = peakContours.get(j);
                                    let M = cv.moments(peakContour);
                                    if (M.m00 !== 0) {
                                        let cx = (M.m10 / M.m00) + rect.x + roiX;
                                        let cy = (M.m01 / M.m00) + rect.y + roiY;
                                        rawCenters.push({ x: cx, y: cy });
                                    }
                                    peakContour.delete();
                                }
                            } else {
                                let M = cv.moments(contour);
                                if (M.m00 !== 0) {
                                    let cx = (M.m10 / M.m00) + roiX;
                                    let cy = (M.m01 / M.m00) + roiY;
                                    rawCenters.push({ x: cx, y: cy });
                                }
                            }
                            
                            tempConts.delete();
                            mask.delete();
                            contourRoi.delete();
                            maskRoi.delete();
                            maskedRoi.delete();
                            dist.delete();
                            distThresh.delete();
                            distThresh8U.delete();
                            peakContours.delete();
                            peakHierarchy.delete();
                        } else {
                            // Part tunggal normal
                            let M = cv.moments(contour);
                            if (M.m00 !== 0) {
                                let cx = (M.m10 / M.m00) + roiX;
                                let cy = (M.m01 / M.m00) + roiY;
                                rawCenters.push({ x: cx, y: cy });
                            }
                        }
                    }
                }

                // 8. FILTER INTEGRASI ANTI-DOUBLE-COUNT (Merging Overlapping Centroids)
                let finalCenters = [];
                for (let i = 0; i < rawCenters.length; i++) {
                    let pt = rawCenters[i];
                    let merged = false;
                    for (let j = 0; j < finalCenters.length; j++) {
                        let fPt = finalCenters[j];
                        let dist = Math.hypot(pt.x - fPt.x, pt.y - fPt.y);
                        
                        if (dist < mergeDist) {
                            fPt.x = (fPt.x * fPt.count + pt.x) / (fPt.count + 1);
                            fPt.y = (fPt.y * fPt.count + pt.y) / (fPt.count + 1);
                            fPt.count += 1;
                            merged = true;
                            break;
                        }
                    }
                    if (!merged) {
                        finalCenters.push({ x: pt.x, y: pt.y, count: 1 });
                    }
                }

                // Menggambar penanda final di layar canvas
                let count = 0;
                for (let i = 0; i < finalCenters.length; i++) {
                    let pt = finalCenters[i];
                    cv.circle(src, new cv.Point(pt.x, pt.y), 4, [34, 197, 94, 255], -1); // Isi hijau terang
                    cv.circle(src, new cv.Point(pt.x, pt.y), 6, [0, 0, 0, 255], 1.5);   // Outline hitam
                    count++;
                }

                // 9. RENDER BINGKAI SCANNING PROFESIONAL (Visual ROI)
                let colorBorder = [59, 130, 246, 255]; // Biru modern
                let colorCorners = [34, 197, 94, 255]; // Siku hijau terang
                
                cv.rectangle(src, new cv.Point(roiX, roiY), new cv.Point(roiX + roiW, roiY + roiH), colorBorder, 1);
                
                let len = Math.min(roiW, roiH) * 0.08;
                // Siku Kiri Atas
                cv.line(src, new cv.Point(roiX, roiY), new cv.Point(roiX + len, roiY), colorCorners, 3);
                cv.line(src, new cv.Point(roiX, roiY), new cv.Point(roiX, roiY + len), colorCorners, 3);
                // Siku Kanan Atas
                cv.line(src, new cv.Point(roiX + roiW, roiY), new cv.Point(roiX + roiW - len, roiY), colorCorners, 3);
                cv.line(src, new cv.Point(roiX + roiW, roiY), new cv.Point(roiX + roiW, roiY + len), colorCorners, 3);
                // Siku Kiri Bawah
                cv.line(src, new cv.Point(roiX, roiY + roiH), new cv.Point(roiX + len, roiY + roiH), colorCorners, 3);
                cv.line(src, new cv.Point(roiX, roiY + roiH), new cv.Point(roiX, roiY + roiH - len), colorCorners, 3);
                // Siku Kanan Bawah
                cv.line(src, new cv.Point(roiX + roiW, roiY + roiH), new cv.Point(roiX + roiW - len, roiY + roiH), colorCorners, 3);
                cv.line(src, new cv.Point(roiX + roiW, roiY + roiH), new cv.Point(roiX + roiW, roiY + roiH - len), colorCorners, 3);

                cv.imshow(ui.canvas, src);
                if (ui.countText) ui.countText.innerText = count;

            } catch (err) {
                console.error("OpenCV Error:", err);
            } finally {
                // Garbage Collection OpenCV manual untuk kestabilan memori HP
                if (src && !src.isDeleted()) src.delete();
                if (gray && !gray.isDeleted()) gray.delete();
                if (roiGray && !roiGray.isDeleted()) roiGray.delete();
                if (roiBlurred && !roiBlurred.isDeleted()) roiBlurred.delete();
                if (roiThresh && !roiThresh.isDeleted()) roiThresh.delete();
                if (preprocessedGray && !preprocessedGray.isDeleted()) preprocessedGray.delete();
                if (tempThresh && !tempThresh.isDeleted()) tempThresh.delete();
                if (kernel && !kernel.isDeleted()) kernel.delete();
                if (contours && !contours.isDeleted()) contours.delete();
                if (hierarchy && !hierarchy.isDeleted()) hierarchy.delete();
            }
        }

        // --- EVENT BINDING & INISIALISASI ---
        function init() {
            if (window.proScannerInitialized) return;
            window.proScannerInitialized = true;

            if (ui.camSelect) {
                ui.camSelect.addEventListener('change', (e) => {
                    currentFacingMode = e.target.value;
                    startCamera();
                });
            }

            if (ui.fileInput) {
                ui.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        isLiveMode = false;
                        stopCamera();
                        ui.imgSrc.src = URL.createObjectURL(file);
                        currentImageLoaded = true;
                        updateScreenState();
                    }
                });
            }

            if (ui.btnCapture) {
                ui.btnCapture.addEventListener('click', () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = ui.video.videoWidth;
                    canvas.height = ui.video.videoHeight;
                    canvas.getContext('2d').drawImage(ui.video, 0, 0);
                    
                    ui.imgSrc.src = canvas.toDataURL('image/jpeg');
                    isLiveMode = false;
                    stopCamera();
                    currentImageLoaded = true;
                    updateScreenState();
                });
            }

            if (ui.imgSrc) {
                ui.imgSrc.addEventListener('load', () => {
                    if(cvReady) processImage();
                });
            }

            if (ui.btnStartCam) {
                ui.btnStartCam.addEventListener('click', async () => {
                    if (isLiveMode) {
                        isLiveMode = false;
                        stopCamera();
                        updateScreenState();
                    } else {
                        isLiveMode = true;
                        currentImageLoaded = false;
                        updateScreenState();
                        startCamera();
                    }
                });
            }
        }

        // Jalankan inisialisasi setelah seluruh DOM siap
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
